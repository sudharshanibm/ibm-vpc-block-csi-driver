name: Verify multi-architecture image builds

on:
  push:
    branches:
      - validation/multiarch-staging-images
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build all architectures with the Cloud Build tool image
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/docker-config:/tmp/docker-config" \
            -w /workspace \
            -e DOCKER_CONFIG=/tmp/docker-config \
            -e DOCKER_CLI_EXPERIMENTAL=enabled \
            registry.k8s.io/releng/gcb-docker-gcloud:v20260806 \
            make docker-build-all CORE_DRIVER_IMG=ibm-vpc-block-csi-driver-validation TAG=pr-${GITHUB_SHA:0:12}

      - name: Verify image platforms
        run: |
          for arch in amd64 arm64 ppc64le s390x; do
            actual=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "ibm-vpc-block-csi-driver-validation:${arch}-pr-${GITHUB_SHA:0:12}")
            echo "$arch: $actual"
            test "$actual" = "linux/$arch"
          done
