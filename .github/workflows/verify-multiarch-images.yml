name: Verify multi-architecture image builds

on:
  push:
    branches:
      - validation/multiarch-staging-images
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Enable non-native architectures
        run: docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install all

      - name: Create Buildx builder
        run: |
          docker buildx create --name csi-validation --driver docker-container --bootstrap --use
          docker buildx inspect --bootstrap

      - name: Build all architecture images without pushing
        run: make docker-build-all CORE_DRIVER_IMG=ibm-vpc-block-csi-driver-validation TAG=pr-${GITHUB_SHA:0:12}

      - name: Verify image platforms
        run: |
          for arch in amd64 arm64 ppc64le s390x; do
            actual=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "ibm-vpc-block-csi-driver-validation:${arch}-pr-${GITHUB_SHA:0:12}")
            echo "$arch: $actual"
            test "$actual" = "linux/$arch"
          done
