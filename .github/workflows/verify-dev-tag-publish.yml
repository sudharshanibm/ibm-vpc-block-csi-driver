name: Validate dev-tag image publishing

on:
  push:
    tags:
      - 'v*-dev.multiarch.fork.*'

permissions:
  contents: read
  packages: write

jobs:
  publish-and-verify:
    if: github.repository == 'sudharshanibm/ibm-vpc-block-csi-driver'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/sudharshanibm/ibm-vpc-block-csi-driver-dev-validation
    steps:
      - name: Check out the dev tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: Check production files match PR 280
        run: |
          git diff --exit-code 1b91754f6cbb74bba0e30b1264f3a2e6f864b517 -- \
            Makefile cloudbuild.yaml Dockerfile Dockerfile.builder scripts/build-bin.sh
          echo "BUILD_TAG=v$(date -u +%Y%m%d)-${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/devtag-docker-config" >> "$GITHUB_ENV"

      - name: Build and publish with the proposed Cloud Build tool image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$DOCKER_CONFIG:/tmp/docker-config" \
            -w /workspace \
            -e DOCKER_CONFIG=/tmp/docker-config \
            -e DOCKER_CLI_EXPERIMENTAL=enabled \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/workspace \
            registry.k8s.io/releng/gcb-docker-gcloud:v20260806 \
            make release-staging \
              CORE_DRIVER_IMG="$IMAGE" \
              TAG="$BUILD_TAG" \
              PULL_BASE_REF="$GITHUB_REF_NAME" \
              RELEASE_ALIAS_TAG="$GITHUB_REF_NAME"

      - name: Verify published image configurations and both manifests
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          image = os.environ['IMAGE']
          build_tag = os.environ['BUILD_TAG']
          alias = os.environ['GITHUB_REF_NAME']
          expected = {'linux/amd64', 'linux/arm64', 'linux/ppc64le', 'linux/s390x'}
          errors = []
          rows = []

          def inspect(ref, image_config=False):
              args = ['docker', 'buildx', 'imagetools', 'inspect']
              args += ['--format', '{{json .Image}}'] if image_config else ['--raw']
              return json.loads(subprocess.check_output(args + [ref], text=True))

          for arch in ('amd64', 'arm64', 'ppc64le', 's390x'):
              ref = f'{image}:{arch}-{build_tag}'
              config = inspect(ref, image_config=True)
              actual = f"{config.get('os')}/{config.get('architecture')}"
              rows.append(f'| `{arch}-{build_tag}` | `{actual}` |')
              print(f'{ref}: image configuration = {actual}', flush=True)
              if actual != f'linux/{arch}':
                  errors.append(f'{ref}: expected linux/{arch}, got {actual}')

          for tag in (build_tag, alias):
              ref = f'{image}:{tag}'
              manifest = inspect(ref)
              actual = {
                  f"{m['platform'].get('os')}/{m['platform'].get('architecture')}"
                  for m in manifest.get('manifests', [])
              }
              if not actual:
                  config = inspect(ref, image_config=True)
                  actual = {f"{config.get('os')}/{config.get('architecture')}"}
              platforms = ', '.join(sorted(actual))
              print(f'{ref}: published platforms = {platforms}', flush=True)
              rows.append(f'| `{tag}` | `{platforms}` |')
              if actual != expected:
                  errors.append(f'{ref}: expected {sorted(expected)}, got {sorted(actual)}')

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Dev-tag build and publishing validation\n\n')
              summary.write(f"Tag: `{alias}`; workflow commit: `{os.environ['GITHUB_SHA']}`.\n\n")
              summary.write('Production files match PR #280 commit `1b91754f`.\n\n')
              summary.write(f'Registry image: `{image}`.\n\n')
              summary.write('| Published tag | Verified platforms |\n| --- | --- |\n')
              summary.write('\n'.join(rows) + '\n\n')
              summary.write('This tests `make release-staging` using the proposed Cloud Build tool image on GitHub Actions. It does not test upstream Cloud Build IAM or the staging registry.\n\n')
              if errors:
                  summary.write('Verification failures:\n\n' + '\n'.join(f'- {error}' for error in errors) + '\n')

          if errors:
              for error in errors:
                  print(f'::error::{error}', flush=True)
              raise SystemExit(1)
          PY

      - name: Remove registry credentials
        if: always()
        run: |
          if [ -n "${DOCKER_CONFIG:-}" ]; then
            docker logout ghcr.io || true
            rm -rf "$DOCKER_CONFIG"
          fi
